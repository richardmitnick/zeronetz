<!-- ================= NOTICE BAR ================= -->
 
<div class="notice-bar" id="noticeBar">
  <span class="notice-dot"></span>
  <span>This Website Is Currently under Maintenance</span>
  <button class="notice-close" id="noticeClose" aria-label="Close notice">&times;</button>
</div>
 
<style>
  .notice-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 40px 10px 16px;
    background: #0a0e14;
    color: #e2e8f0;
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    animation: noticeSlideDown 0.5s ease-out;
  }
 
  @keyframes noticeSlideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
 
  .notice-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    flex-shrink: 0;
    animation: noticePulse 2s infinite;
  }
 
  @keyframes noticePulse {
    0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }
 
  .notice-bar a {
    color: #22c55e;
    text-decoration: underline;
    font-weight: 600;
  }
 
  .notice-close {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.9;
    line-height: 1;
    padding: 4px;
  }
  .notice-close:hover { opacity: 1; }
 
  .notice-bar.hide {
    animation: noticeSlideUp 0.35s ease-in forwards;
  }
  @keyframes noticeSlideUp {
    to { transform: translateY(-100%); opacity: 0; }
  }
</style>
 
<script>
  document.getElementById('noticeClose').addEventListener('click', function () {
    var bar = document.getElementById('noticeBar');
    bar.classList.add('hide');
    setTimeout(function () { bar.style.display = 'none'; }, 350);
  });
</script>
