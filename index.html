<!doctype html><html lang="en"><head><meta charset="UTF-8"/><link rel="icon" type="image/png" href="/favicon.png"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ZeroNetz | Penetration Testing &amp; Threat Intelligence</title><meta name="description" content="ZeroNetz offers professional penetration testing, vulnerability assessment, and threat intelligence services to protect your business from cyber threats."/><meta property="og:type" content="website"/><meta property="og:url" content="https://zeronetz.vercel.app/"/><meta property="og:title" content="ZeroNetz | Professional Cybersecurity &amp; Threat Intelligence"/><meta property="og:description" content="ZeroNetz offers professional penetration testing, vulnerability assessment, and threat intelligence services to protect your business from cyber threats."/><meta property="og:image" content="https://zeronetz.vercel.app/favicon.png"/><meta name="twitter:card" content="summary_large_image"/><meta name="twitter:url" content="https://zeronetz.vercel.app/"/><meta name="twitter:title" content="ZeroNetz | Professional Cybersecurity &amp; Threat Intelligence"/><meta name="twitter:description" content="ZeroNetz offers professional penetration testing, vulnerability assessment, and threat intelligence services to protect your business from cyber threats."/><meta name="twitter:image" content="https://zeronetz.vercel.app/favicon.png"/></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script><div class="notice-overlay" id="noticeOverlay"><div class="notice-modal" id="noticeModal"><div class="notice-titlebar"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span class="dot dot-green"></span></div><div class="notice-body"><div class="notice-label">Notice</div><h2>Site Under Maintenance</h2><p>We're improving a few things behind the scenes. Some features may not work as expected right now.</p><div class="notice-timer" id="noticeTimer"><div class="timer-box"><span id="tDays">00</span><label>Days</label></div><div class="timer-box"><span id="tHours">00</span><label>Hours</label></div><div class="timer-box"><span id="tMins">00</span><label>Mins</label></div><div class="timer-box"><span id="tSecs">00</span><label>Secs</label></div></div><button class="notice-btn" id="noticeOk">Continue to site</button></div></div></div><style>.notice-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;opacity:0;animation:noticeFadeIn .35s ease-out forwards}@keyframes noticeFadeIn{to{opacity:1}}.notice-overlay.hide{animation:noticeFadeOut .25s ease-in forwards}@keyframes noticeFadeOut{to{opacity:0}}.notice-modal{background:#fff;border-radius:20px;max-width:520px;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',system-ui,sans-serif;box-shadow:0 20px 50px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.06);transform:scale(.94) translateY(8px);opacity:0;animation:noticePopIn .4s 50ms cubic-bezier(.16,1,.3,1) forwards}@keyframes noticePopIn{to{transform:scale(1) translateY(0);opacity:1}}.notice-titlebar{display:flex;align-items:center;gap:8px;padding:13px 14px;background:#f6f6f7;border-bottom:1px solid rgba(0,0,0,.06)}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}.dot-red{background:#ff5f57}.dot-yellow{background:#febc2e}.dot-green{background:#28c840}.notice-body{padding:42px 40px 40px;text-align:center}.notice-label{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8e8e93;margin-bottom:14px}.notice-modal h2{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 10px;line-height:1.3;color:#000}.notice-modal p{font-size:17px;font-weight:400;letter-spacing:-.01em;color:#6e6e73;margin:0 0 30px;line-height:1.55}.notice-timer{display:flex;justify-content:center;gap:12px;margin-bottom:28px}.timer-box{background:#f5f5f7;border:none;border-radius:16px;padding:16px 4px;width:82px}.timer-box span{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;color:#000;font-variant-numeric:tabular-nums;transition:transform .15s ease,opacity .15s ease}.timer-box span.tick{animation:noticeTick .4s cubic-bezier(.34,1.56,.64,1)}@keyframes noticeTick{0%{transform:translateY(-6px);opacity:0}60%{transform:translateY(1px);opacity:1}100%{transform:translateY(0);opacity:1}}.timer-box label{display:block;font-size:11px;font-weight:500;color:#8e8e93;text-transform:uppercase;letter-spacing:.02em;margin-top:4px}.notice-btn{background:#000;color:#fff;border:none;border-radius:980px;padding:17px 26px;font-family:inherit;font-size:17px;font-weight:590;letter-spacing:-.01em;cursor:pointer;width:100%;transition:opacity .2s ease,transform .2s ease}.notice-btn:hover{opacity:.85}.notice-btn:active{transform:scale(.97);opacity:.75}@media(max-width:480px){.notice-body{padding:30px 24px 26px}.notice-modal h2{font-size:19px}.notice-modal p{font-size:14.5px}.timer-box{width:60px;padding:10px 2px}.timer-box span{font-size:18px}}</style><script>(function(){var overlay=document.getElementById("noticeOverlay"),okBtn=document.getElementById("noticeOk");if(okBtn&&overlay){okBtn.addEventListener("click",function(){overlay.classList.add("hide");setTimeout(function(){overlay.style.display="none"},250)})}var targetDate=new Date("2026-09-01T00:00:00");function setTimeVal(id,val){var el=document.getElementById(id);if(!el)return;var formatted=String(val).padStart(2,"0");if(el.textContent!==formatted){el.textContent=formatted;el.classList.remove("tick");void el.offsetWidth;el.classList.add("tick")}}function updateCountdown(){var now=new Date(),diff=targetDate.getTime()-now.getTime(),timerEl=document.getElementById("noticeTimer");if(diff<=0){if(timerEl)timerEl.innerHTML='<p style="font-size:13px;color:#64748b;margin:0;">Maintenance window has ended.</p>';if(timerInterval)clearInterval(timerInterval);return}var days=Math.floor(diff/(1e3*60*60*24)),hours=Math.floor(diff/(1e3*60*60)%24),mins=Math.floor(diff/(1e3*60)%60),secs=Math.floor(diff/1e3%60);setTimeVal("tDays",days);setTimeVal("tHours",hours);setTimeVal("tMins",mins);setTimeVal("tSecs",secs)}updateCountdown();var timerInterval=setInterval(updateCountdown,1000)})();</script></body></html>
