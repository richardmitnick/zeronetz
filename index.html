    <!-- Notice -->
    
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f8fafc;
    color: #1e293b;
  }
 
  /* ---- Notice Bar ---- */
  .notice-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 40px 10px 16px;
    background: #0f172a;
    color: #e2e8f0;
    border-bottom: 1px solid #1e293b;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    position: relative;
    animation: slideDown 0.5s ease-out;
  }
 
  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
 
  /* soft pulsing dot — draws eye without being annoying */
  .notice-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #38bdf8;
    flex-shrink: 0;
    animation: pulse 2s infinite;
  }
 
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
    100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
  }
 
  .notice-bar a {
    color: #38bdf8;
    text-decoration: underline;
    font-weight: 600;
  }
 
  .notice-close {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.9;
    line-height: 1;
    padding: 4px;
  }
  .notice-close:hover { opacity: 1; }
 
  .notice-bar.hide {
    animation: slideUp 0.35s ease-in forwards;
  }
  @keyframes slideUp {
    to { transform: translateY(-100%); opacity: 0; }
  }
 
  /* demo page content */
  .content { padding: 60px 24px; max-width: 700px; margin: 0 auto; }
</style>
</head>
<body>
 
  <div class="notice-bar" id="noticeBar">
    <span class="notice-dot"></span>
    <span> This Website Is Currently Under Maintenance</a></span>
    <button class="notice-close" id="noticeClose" aria-label="Close notice">&times;</button>
  </div>

  <script>
    document.getElementById('noticeClose').addEventListener('click', function () {
      const bar = document.getElementById('noticeBar');
      bar.classList.add('hide');
      setTimeout(() => bar.style.display = 'none', 350);
  </script>
